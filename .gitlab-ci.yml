# MR 게이트 — 로컬 `npm run check`와 동일한 검사를 MR에서 강제한다.
# 목표: MR 피드백 3분 이내. 캐시가 깨지면 이 목표부터 무너지므로 캐시 설정을 함부로 지우지 말 것.
#
# ✅ 검증 완료 (2026-08-12, 같은 GitLab 인스턴스의 개인 테스트 레포):
#   통과 MR 그린(0.6분) / 타입 오류 MR은 fe-check에서, 브랜치명 위반 MR은
#   branch-name에서 정확히 실패 / rules:changes·캐시·ai-review graceful skip 확인.
# ai-review도 검증 완료 (test 레포 MR !4): 코멘트 작성 + 마커 기반 갱신 확인.
# 본 레포 발급 시 남은 작업: 러너 등록 + Protected branches 등 UI 설정 + CI 변수 2개
# (docs/protected-branches-setup.md, docs/ai-review-gemini.md).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

default:
  interruptible: true

stages:
  - validate
  - check
  - review

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.cache/gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# ── validate: 브랜치명·커밋 형식 (수 초 내 실패 피드백) ─────────────────

branch-name:
  stage: validate
  image: alpine:3.22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      BRANCH="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      echo "source branch: $BRANCH"
      # 형식(docs/branch-strategy.md): <type>/<description> 또는 release/x.y.z
      # Jira 키는 넣지 않는다 (2026-08-31 팀 결정). 과거에 만든 키 포함 브랜치는 계속 허용.
      # `dev`는 dev→main 동기화 MR의 source로 허용한다.
      if echo "$BRANCH" | grep -Eq '^(feat|bugfix|refactor|docs|hotfix)/([A-Z][A-Z0-9]*-[0-9]+-)?[a-z0-9]+(-[a-z0-9]+)*$|^release/[0-9]+\.[0-9]+\.[0-9]+$|^dev$'; then
        echo "OK: 브랜치명이 규칙을 따릅니다."
      else
        echo "FAIL: 브랜치명이 docs/branch-strategy.md 규칙과 다릅니다."
        echo "예: feat/login, bugfix/token-refresh, docs/api-guide, release/1.0.0"
        exit 1
      fi

commitlint:
  stage: validate
  # node:24-alpine에는 git이 없어 commitlint의 `git merge-base` 호출이 실패한다.
  image: node:24
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .cache/npm
  script:
    - npm ci --ignore-scripts
    - npx commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to HEAD --verbose

# ── check: lint + typecheck + test (로컬 npm run check / check:data와 동일) ──────

android-check:
  stage: check
  # Android SDK 포함 이미지 (CircleCI 공식 이미지, Docker Hub).
  image: cimg/android:2024.10
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - android/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  cache:
    key:
      files:
        - android/gradle/wrapper/gradle-wrapper.properties
        - android/app/build.gradle.kts
    paths:
      - .cache/gradle/wrapper
      - .cache/gradle/caches
  script:
    - cd android
    - ./gradlew ktlintCheck testDebugUnitTest --build-cache --console=plain

be-check:
  stage: check
  image: eclipse-temurin:21-jdk
  # 백엔드 테스트는 실제 PostgreSQL을 사용한다 (backend/docs/backend-common-settings.md).
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:7.4-alpine
      alias: redis
  variables:
    POSTGRES_DB: app
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app-ci-only
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
    SPRING_DATASOURCE_USERNAME: app
    SPRING_DATASOURCE_PASSWORD: app-ci-only
    TEST_REDIS_URL: redis://redis:6379
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/build.gradle
    paths:
      - .cache/gradle/wrapper
      - .cache/gradle/caches
  script:
    - cd backend
    - ./gradlew check --build-cache --console=plain

data-check:
  stage: check
  # matching worker 상태 전이는 실제 PostgreSQL V1 스키마에서 검증한다.
  # 임베딩 러너 테스트는 모의 파이프라인을 주입해 torch 없이 계약(형식·재개·버전 격리)만 검증한다.
  # ai/ 의 pytest는 torch(수 GB)와 가중치가 필요해 여기 넣지 않는다 — 서버 2 venv에서 수동 실행(AI팀 합의 전).
  image: python:3.12-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_DB: matching_worker_test
    POSTGRES_USER: matching_worker
    POSTGRES_PASSWORD: matching-worker-ci-only
    MATCH_WORKER_TEST_DSN: postgresql://matching_worker:matching-worker-ci-only@postgres:5432/matching_worker_test
    MATCH_WORKER_TEST_APPLY_SCHEMA: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - data/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  cache:
    key:
      files:  # GitLab 은 cache:key:files 에 최대 2개 — 실행 의존성 두 파일만 키로 쓴다 (pytest 핀은 거의 안 바뀜)
        - data/collector/requirements.txt
        - data/eval/requirements.txt
    paths:
      - .cache/pip
  script:
    - pip install -q -r data/collector/requirements.txt -r data/collector/requirements-dev.txt -r data/eval/requirements.txt
    - python -m pytest data --ignore=data/mapreduce -q

# ── review: AI 리뷰 (non-blocking — 실패해도 머지를 막지 않는다) ────────

ai-review:
  stage: review
  image: node:24-alpine
  needs: []
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ /^Draft:/'
  script:
    - node scripts/ai-review-gemini.mjs
