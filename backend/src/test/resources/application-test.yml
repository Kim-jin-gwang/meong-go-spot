spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:tc:postgresql:17-alpine:///app}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app-test-only}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/testmigration

# 테스트 소스 전용 값. 배포 artifact에는 포함되지 않는다.
