# 운영 배포 구성 — Jenkins가 credential(Secret file)로 주입하는 env 파일과 함께 사용한다.
# 2026-08-31 서버 1 첫 배포 성공 (docs/deploy-guide.md 검증 이력 참조).
# 필요한 키 목록은 루트 .env.example 참조. 이 저장소에 실제 .env를 커밋하지 않는다.
#
# 이미지 태그: Jenkins가 IMAGE_TAG=<BUILD_NUMBER>로 빌드한다.
# 이전 태그 이미지는 서버에 남으므로 롤백은 IMAGE_TAG를 되돌려 재기동한다 (docs/deploy-guide.md).
# 클라이언트는 Android 앱(스토어/APK 배포)이라 웹 서빙 컨테이너가 없다.
# 외부 노출은 호스트 nginx가 담당한다 — api.meonggo.shop 의 80/443을 받아
# 127.0.0.1:8080 으로 프록시한다 (docs/deploy-guide.md TLS 종단 절). 그래서 backend는
# 루프백에만 바인딩한다. 0.0.0.0 으로 올리면 Docker가 UFW를 우회해 평문 API가 공개된다.
# A0~A5 운영 전 Redis와 JWT·암호화·HMAC Secret file read-only mount를 반드시 구현한다.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: meong-go-spot-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # 사용자 사진 WebHDFS. 비밀이 아니라 내부 토폴로지이므로 기본값을 여기에 둔다
      # (docs/bigdata-cluster.md). 세 값이 모두 비면 PhotoStorageConfiguration 이
      # UnavailablePhotoStorage 를 반환하고, 사진이 필수인 게시물 등록이 전량 실패한다.
      #
      # DataNode origin 은 둘 다 넣는다. WebHDFS 는 307 로 DataNode 를 지정하는데 대상이
      # 매번 다르다 — 클라이언트가 서버 1 이면 보통 bd-worker1 이 뽑히지만 그 DataNode 가
      # 내려가면 bd-master 가 뽑힌다. 허용 목록에 없으면 리다이렉트를 거부한다.
      #
      # 두 경로 모두 방화벽 예외가 필요하다 (2026-09-11 실측).
      #   bd-master:9870·9864 → FORWARD, infra/scripts/docker-user-rules.sh 의 ACCEPT
      #   bd-worker1:9864     → INPUT,   UFW `allow from 172.18.0.0/16 to any port 9864`
      PHOTO_HDFS_NAMENODE_URL: ${PHOTO_HDFS_NAMENODE_URL:-http://bd-master:9870}
      PHOTO_HDFS_DATANODE_URLS: ${PHOTO_HDFS_DATANODE_URLS:-http://bd-worker1:9864,http://bd-master:9864}
      PHOTO_HDFS_USER: ${PHOTO_HDFS_USER:-ubuntu}
      PHOTO_CLEANUP_ENABLED: ${PHOTO_CLEANUP_ENABLED:-false}
      PHOTO_CLEANUP_CRON: ${PHOTO_CLEANUP_CRON:-0 0 4 * * *}
      MEMBER_PHOTO_ERASURE_POLL_INTERVAL: ${MEMBER_PHOTO_ERASURE_POLL_INTERVAL:-PT1M}
      PHOTO_UPLOAD_MAX_CONCURRENCY: ${PHOTO_UPLOAD_MAX_CONCURRENCY:-1}
      MATCH_MODEL_ID: ${MATCH_MODEL_ID:-dinov2_vitb14}
      MATCH_MODEL_VERSION: ${MATCH_MODEL_VERSION:-v2}
      FCM_DAILY_SUMMARY_ENABLED: ${FCM_DAILY_SUMMARY_ENABLED:-false}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_DAILY_SUMMARY_POLL_INTERVAL: ${FCM_DAILY_SUMMARY_POLL_INTERVAL:-PT1M}
      FCM_SEND_TIMEOUT: ${FCM_SEND_TIMEOUT:-PT10S}
      # 앱 버전 안내 (V1 GET /api/v1/app/version). 릴리즈 절차(docs/deploy-guide.md)에서 함께 올린다.
      #   LATEST = 스토어에 올린 최신 versionCode → 그 미만 앱에 "새 버전" 권고(하루 한 번, 닫을 수 있음)
      #   MIN    = 서버 API 가 옛 앱과 호환되지 않게 바뀐 배포에서만 올린다 → 그 미만 앱은 업데이트 전까지 막힘
      APP_ANDROID_LATEST_VERSION_CODE: ${APP_ANDROID_LATEST_VERSION_CODE:-8}
      APP_ANDROID_MIN_VERSION_CODE: ${APP_ANDROID_MIN_VERSION_CODE:-0}
      APP_ANDROID_STORE_URL: ${APP_ANDROID_STORE_URL:-https://m.onestore.co.kr/v2/ko-kr/app/0001009297}
      # 비밀 값과 파일 경로는 마운트된 prod.yml 이 소유한다 (아래 volumes 주석).
      # 여기에 ${...:-} 로 두면 값이 비어도 환경변수 자체는 만들어지고, Spring 에서
      # OS 환경변수는 설정 파일보다 우선하므로 required() 가 blank 로 거부해 기동이 실패한다.
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/secrets/prod.yml
      # 아래 6개는 비밀이 아니고 정책 고정값이다. SessionTokenConfiguration 이
      # requiredDuration·requiredIdentifier 로 값을 요구하면서 코드의 상수와 일치하는지까지
      # 검사하므로, 바꾸면 기동이 실패한다. 리터럴로 두어 변경이 리뷰에 드러나게 한다.
      AUTH_ACCESS_TOKEN_TTL: PT15M
      AUTH_REFRESH_TOKEN_TTL: P30D
      AUTH_JWT_CLOCK_SKEW: PT30S
      AUTH_JWT_ISSUER: meonggocuisine-auth
      AUTH_JWT_AUDIENCE: meonggocuisine-api
      AUTH_JWT_CLIENT_ID: meonggocuisine-android
      # nginx 만 X-Forwarded-For 를 전달할 수 있게 한다. 값은 실측이다 (2026-09-11):
      # 호스트 루프백에서 발행 포트로 들어오면 컨테이너가 보는 peer 는 docker 브리지
      # 게이트웨이 172.18.0.1 이고, 비루프백·외부 트래픽은 출발지 IP 가 보존된다.
      # 즉 nginx 경유만 신뢰되고 직접 접속은 실제 IP 를 그대로 쓴다.
      # 아래 networks 의 고정 서브넷에서 나오는 값이므로 서브넷을 바꾸면 함께 바꿔야 한다.
      # 비우면 모든 요청의 클라이언트 IP 가 172.18.0.1 하나로 뭉쳐 IP 기준 제한
      # (AUTH_LOGIN_IP_FAILURE_LIMIT, PHONE_SEND_IP_HOURLY_LIMIT)이 전체 사용자를
      # 한 덩어리로 차단한다.
      AUTH_TRUSTED_PROXY_CIDRS: 172.18.0.1/32
    volumes:
      # 기동에 필요한 키 자료와 설정을 담은 디렉터리 하나를 읽기 전용으로 붙인다.
      # 생성은 infra/scripts/setup-prod-secrets.py 가 한다 (값은 레포에 들어오지 않는다).
      # 담기는 것: prod.yml, jwt-private.pem, jwt-public-jwks.json,
      #            phone-keyring.json, location-keyring.json,
      #            region-codes.csv(승인된 공식 데이터), solapi.properties, redis.conf
      # create_host_path: false — 디렉터리가 없으면 빈 디렉터리를 만들지 말고 실패해야 한다.
      - type: bind
        source: ${PROD_SECRETS_DIR:-/home/ubuntu/.secrets/prod}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # OTP·가입 증명·로그인 실패 제한이 Lua 원자 연산으로 쓴다. 로그인은 회원 조회보다
  # 먼저 이 저장소를 호출하므로(LoginService) redis 가 없으면 로그인 자체가 안 된다.
  # 외부로 publish 하지 않는다 — compose 네트워크 안에서만 접근한다.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # 비밀번호를 command 인자로 주면 docker inspect 와 ps 에 남으므로 설정 파일로 넘긴다.
    command: ["redis-server", "/run/secrets/redis.conf"]
    volumes:
      - type: bind
        source: ${PROD_SECRETS_DIR:-/home/ubuntu/.secrets/prod}/redis.conf
        target: /run/secrets/redis.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # 비밀번호를 헬스체크 인자로도 두지 않는다. 인증 없이 PING 하면 NOAUTH 가 오는데
      # 그 응답 자체가 서버가 떠서 명령을 처리하고 있다는 증거다.
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      # 루프백에만 publish 한다. 서버 1 의 호스트 프로세스(매칭 worker, 공공데이터 적재기)가
      # 붙어야 하는데 compose 네트워크 밖에서는 닿지 않기 때문이다.
      #
      # "DB 류는 publish 금지"(docs/deploy-guide.md)의 취지는 인터넷 노출을 막는 것이고
      # 127.0.0.1 바인딩은 외부에서 접근할 수 없으므로 그 취지에 어긋나지 않는다. Docker
      # publish 가 UFW 를 우회하는 문제도 루프백에는 해당하지 않는다.
      #
      # 0.0.0.0 이나 사설 IP 로 바꾸지 말 것. 그 순간 UFW 를 우회해 공개된다 — 막으려면
      # DOCKER-USER 규칙이 유일한 방어선이 되고, 그건 팀 승인이 필요한 예외다.
      #
      # 스모크 스택을 띄울 때는 이 매핑도 override 해야 한다 (운영과 포트가 겹친다).
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

# HDFS 방화벽 예외의 source CIDR과 일치시킨다. 변경 시 기존 네트워크 재생성이 필요하다.
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
