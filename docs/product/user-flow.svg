  <path d="M420 1352H330V1500" class="edge"/><text x="348" y="1374" class="label">다른 회원 USER</text>
  <rect x="220" y="1500" width="220" height="62" rx="10" class="action"/><text x="330" y="1523">1:1 텍스트 채팅</text><text x="330" y="1545" class="small">읽음 · REST 증분 갱신</text>
