<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1780" viewBox="0 0 1400 1780" role="img" aria-labelledby="title description">
  <title id="title">멍고반점 MVP 사용자 흐름</title>
  <desc id="description">게시물 목록, 인증, 상세, 등록, 버튼 기반 비동기 분석, 읽음 상태와 개인 알림을 포함한 채팅, 일일 요약의 시각 요약. 세부 계약은 user-flow.md를 우선한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#334155"/></marker>
    <style>
      .start{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.screen{fill:#fff;stroke:#334155;stroke-width:2}.action{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.decision{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.result{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.warn{fill:#fefce8;stroke:#a16207;stroke-width:2}.external{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.edge{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.return{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#arrow)}text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#0f172a;font-size:16px;text-anchor:middle;dominant-baseline:middle}.heading{font-size:22px;font-weight:bold}.small{font-size:13px}.label{font-size:13px;fill:#475569}
    </style>
  </defs>

