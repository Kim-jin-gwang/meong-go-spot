# api.meonggo.shop — Android 릴리스 빌드가 쓰는 HTTPS 종단.
#
# nginx 가 80·443 을 모두 잡고 backend 는 127.0.0.1:8080 에만 바인딩한다(compose.prod.yml).
# 80 은 HTTPS 로 보내는 것과 ACME(HTTP-01) 챌린지만 한다. 2026-09-11 구축 당시 backend 가 80 을
# 직접 쓰던 전환 구성(upstream backup, standalone 인증기 + 컨테이너 정지 래퍼)은 2026-09-14 걷어냈다.

upstream backend {
    server 127.0.0.1:8080;
}

# 공공 보호동물 사진 캐시 (아래 location /img/).
#
# 원본 openapi.animal.go.kr 은 TTFB 중앙값 0.7초·p90 6초·최대 11초이고(2026-09-14 실측 60장),
# Cache-Control·ETag·Last-Modified 를 하나도 보내지 않는다. 앱이 원본을 직접 받으면 목록 한 페이지
# (10장 ≈ 3.6MB)에 5초 넘게 걸리는 카드가 섞이고, 스크롤로 돌아올 때마다 다시 받는다.
# 공고 사진은 올라온 뒤 바뀌지 않으므로 한 번 받은 파일은 30일 보관한다.
#
# 이 파일은 sites-available 에서 include 되므로 여기가 http 컨텍스트다.
# max_size 8g: 현재 공공 사진 15,520장 × 중앙값 365KB ≈ 5.5GB 전량이 들어간다. 디스크 여유 252GB.
proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img_cache:20m
                 max_size=8g inactive=30d use_temp_path=off;

# 80 — 평문 API 는 서빙하지 않는다. 인증서 갱신 챌린지만 파일로 응답하고 나머지는 HTTPS 로 보낸다.
# certbot 인증기는 webroot 다 — nginx 플러그인처럼 갱신 때 이 파일을 고쳐 쓰고 reload 하지 않는다.
# 갱신 뒤 새 인증서를 물리는 것은 renewal conf 의 deploy hook(systemctl reload nginx)이 한다.
server {
    listen 80;
    listen [::]:80;
    server_name api.meonggo.shop;

    server_tokens off;
    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.meonggo.shop;

    ssl_certificate     /etc/letsencrypt/live/api.meonggo.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.meonggo.shop/privkey.pem;

    # certbot --nginx 를 쓰지 않아 options-ssl-nginx.conf 가 없다. 직접 지정한다.
    # Android minSdk 26 은 TLS 1.2 를 지원하고 TLS 1.3 은 Android 10 부터다.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling 은 켜지 않는다 — Let's Encrypt 가 인증서에서 OCSP responder
    # URL 을 없앴고(CRL 전환), 켜면 기동마다 "no OCSP responder URL" 경고만 남는다.

    # Spring 의 max-request-size 가 52428800B(50MB)다. 여기서 먼저 413 을 내면
    # 애플리케이션 오류 규약을 쓸 수 없으므로 그보다 크게 잡는다.
    client_max_body_size 60M;

    server_tokens off;
    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # backend/docs/member-signup-guide.md — 신뢰 프록시는 외부 X-Forwarded-For 를
        # 덮어쓰고 실제 클라이언트 IP 하나만 전달한다. $proxy_add_x_forwarded_for 는
        # 클라이언트가 보낸 값에 덧붙여 위조를 허용하므로 쓰지 않는다.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        # RFC 7239 헤더도 클라이언트가 보낼 수 있으므로 지운다.
        proxy_set_header Forwarded         "";

        # 사진 업로드(최대 50MB)를 감안한 여유. 아직 실측 근거가 없는 값이다.
        #
        # 낮추는 쪽의 위험이 더 크다고 판단했다. PHOTO_UPLOAD_MAX_CONCURRENCY=1 이라
        # 업로드가 backend 안에서 직렬화되므로 50MB 요청이 앞 요청 뒤에서 대기할 수 있고,
        # 타임아웃이 낮으면 그대로 504 가 된다. 반대로 값이 커서 생기는 비용은 작다 —
        # nginx 는 이벤트 구동이라 대기 중인 연결이 스레드를 점유하지 않는다.
        #
        # 동기 HTTP 경로의 NFR(docs/architecture.md)은 모두 p95 < 500ms 이고,
        # MATCH_HARD_TIMEOUT=PT60S 는 비동기 worker 의 계산 기한이라 요청 수명과 무관하다.
        # 사진 업로드 소요를 실측한 뒤 그 값으로 다시 정한다.
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 공공 보호동물 사진 캐시 프록시 — 앱의 ApiImageUrlResolver 가
    #   https://openapi.animal.go.kr/openapi/service/rest/fileDownloadSrvc/files/{shelter|loss}/YYYY/MM/<파일>
    # 를 /img/{shelter|loss}/YYYY/MM/<파일> 로 바꿔 부른다. 경로 모양을 정규식으로 못 박아
    # 열린 프록시가 되지 않게 한다. 대괄호(`[1].jpg`)는 %5B%5D 로 오지만 $uri 는 디코드된 값이라
    # 정규식에 [ ] 를 허용한다. 원본은 두 형태 모두 같은 파일을 준다(실측 200, 바이트 동일).
    # 정규식은 따옴표로 감싼다 — 감싸지 않으면 nginx 가 {4} 의 중괄호를 블록 구분자로 읽어 기동에 실패한다.
    location ~* "^/img/(?<image>(shelter|loss)/[0-9]{4}/[0-9]{2}/[A-Za-z0-9._()\[\]-]+\.(jpg|jpeg|png))$" {
        limit_except GET HEAD { deny all; }

        # proxy_pass 에 변수를 쓰면 nginx 가 런타임 DNS 를 요구한다(resolver 없으면 502 "no resolver
        # defined"). rewrite 로 경로만 바꾸고 호스트는 고정해 기동 시 한 번 해석하게 한다 —
        # 원본 IP 가 바뀌면 reload 가 필요하다.
        rewrite ^/img/(.*)$ /openapi/service/rest/fileDownloadSrvc/files/$1 break;
        proxy_pass https://openapi.animal.go.kr;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host openapi.animal.go.kr;
        proxy_set_header Connection "";
        # 클라이언트 정보를 정부 서버에 넘길 이유가 없다.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";

        proxy_cache img_cache;
        proxy_cache_key $image;
        # 원본이 캐시 헤더를 주지 않으므로 우리가 정한다. 404(원본 삭제, 전체의 ~5%)는 10분만 —
        # 나중에 살아나는 경우가 있는지 아직 모른다.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 10m;
        # 같은 사진을 여럿이 동시에 처음 요청하면 한 번만 원본에 간다.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # 원본이 느리거나 죽어도 있는 사본을 준다 (p90 6초, 최대 11초 실측).
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 원본은 application/octet-stream + attachment 로 준다. Content-Type 은 그대로 둔다 — Coil 은
        # 바이트를 보고 디코드하고, jpg·png 가 섞여 있어 한 타입으로 고정하면 틀린 값이 된다.
        # 다운로드 유도 헤더만 지운다.
        proxy_hide_header Content-Disposition;
        # 앱 쪽(Coil)도 캐시할 수 있게 명시한다. respectCacheHeaders(false) 와 무관하게 안전망이다.
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Cache-Status $upstream_cache_status;

        access_log /var/log/nginx/img.access.log;
    }
}
